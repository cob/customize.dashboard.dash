#   accepted          — placeholder ou contacto público autorizado (e.g.
#                       `alice@example.com`, contact email num README).
#                       Nada para mitigar.
#   migrated_to_sops  — PII real movido para um ficheiro SOPS-encrypted.
#   removed           — PII real apagado da árvore.

# NOTA: `migrated_to_sops` e `removed` apagam o valor do snapshot atual
# mas NÃO do histórico git — `git log -p` continua a expor o plaintext.
# Reescrita de história (`git filter-repo` + force-push + re-clone de
# todos os colaboradores) reduz o leak local, mas cópias externas
# (forks, mirrors, CI caches) mantêm-no. Ao contrário de um token, um
# email não é rotacionável: para PII real, trata como data breach e
# notifica os afetados.

